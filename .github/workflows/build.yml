name: Build

on:
  push:
    branches: ["fabric-26.2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Create Fly
        shell: bash
        run: |
          mkdir -p libs
          curl -fsSL -o libs/create-fly-26.2.jar https://github.com/meakaandre-tech/Create-Fly/releases/download/pack-26.2-latest/create-fly-26.2.jar
          # compile with Create Fly's class tweaker, so its injected interfaces and widened members are visible
          unzip -o -j libs/create-fly-26.2.jar create.classtweaker -d libs/
          ls -l libs
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/maxerrs.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "20000", "-Xmaxwarns", "0"]
            }
          }
          GRADLE
          ./gradlew build --no-daemon --continue -Dorg.gradle.console=plain -I /tmp/maxerrs.gradle 2>&1 | tee build.log
      - name: Dump game signatures
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-signatures ]; then
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u > /tmp/ci/classes.txt || true
            sed 's#/#.#g' /tmp/ci/classes.txt | grep -v 'package-info\|module-info' > /tmp/all-classes.txt
            (xargs -a /tmp/all-classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/javap-all.txt.gz
          fi
          if [ -f .github/dump-bytecode ]; then
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            cp=$(echo $jars | tr ' ' ':')
            (xargs -a .github/dump-bytecode javap -p -c -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/bytecode.txt.gz
          fi
      - name: Dump game data files
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-data ]; then
            mkdir -p /tmp/ci-data
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            for j in $jars; do
              while read -r pattern; do
                [ -z "$pattern" ] && continue
                unzip -o -q "$j" "$pattern" -d /tmp/ci-data 2>/dev/null || true
              done < .github/dump-data
            done
            (cd /tmp/ci-data && tar czf /tmp/ci/data.tar.gz . ) || true
          fi
      - name: Dedicated server smoke test
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ci
          exec > >(tee /tmp/ci/smoke.txt) 2>&1
          set -x
          if [ -f .github/smoke-test ] && ls build/libs/*.jar >/dev/null 2>&1; then
            mkdir -p server/mods && cd server
            inst=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['version'])")
            curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/26.2/0.19.5/$inst/server/jar"
            curl -fsSL -o mods/fabric-api.jar "https://cdn.modrinth.com/data/P7dR8mSH/versions/ewUK83HI/fabric-api-0.161.0%2B26.2.jar"
            cp ../libs/create-fly-26.2.jar mods/
            cp $(ls ../build/libs/*.jar | grep -v sources | head -1) mods/
            echo "eula=true" > eula.txt
            printf 'level-seed=12345\nonline-mode=false\nmax-tick-time=-1\nview-distance=4\ngamemode=creative\ndifficulty=peaceful\n' > server.properties
            mkfifo in.fifo
            (java -Xmx4G -jar server.jar --nogui < in.fifo > server.log 2>&1; echo "EXIT $?" >> server.log) &
            exec 3> in.fifo
            for i in $(seq 1 120); do
              if grep -q 'Done (' server.log || grep -q '^EXIT' server.log; then break; fi
              sleep 5
            done
            if grep -q 'Done (' server.log; then
              if [ -f ../.github/smoke-commands.txt ]; then
                while read -r line; do echo "$line" >&3; sleep 0.3; done < ../.github/smoke-commands.txt
                sleep 30
              fi
              echo "stop" >&3
              for i in $(seq 1 60); do grep -q '^EXIT' server.log && break; sleep 2; done
            fi
            exec 3>&-
            ls -l . mods
            cp server.log /tmp/ci/server.log
            cp -r crash-reports /tmp/ci/ 2>/dev/null || true
            cd ..
          fi
      - name: Client smoke test
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ci
          if [ -f .github/smoke-client ] && [ -d server/world ]; then
            exec > >(tee /tmp/ci/smoke-client.txt) 2>&1
            set -x
            sudo apt-get update -q >/dev/null 2>&1
            sudo apt-get install -y -q xvfb xdotool imagemagick libgl1-mesa-dri >/dev/null 2>&1
            mkdir -p run/mods run/saves
            cp libs/create-fly-26.2.jar run/mods/
            cp -r server/world run/saves/world
            rm -f run/saves/world/session.lock
            printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nnarrator:0\nrenderDistance:5\nmaxFps:30\nsoundCategory_master:0.0\n' > run/options.txt
            export LIBGL_ALWAYS_SOFTWARE=1
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            export DISPLAY=:99
            sleep 2
            (timeout 780 ./gradlew runClient --no-daemon -Dorg.gradle.console=plain --args="--quickPlaySingleplayer world" > client-gradle.log 2>&1; echo "EXIT $?" >> client-gradle.log) &
            for i in $(seq 1 130); do
              if grep -q 'logged in with entity id\|joined the game' run/logs/latest.log 2>/dev/null || grep -q '^EXIT' client-gradle.log; then break; fi
              sleep 5
            done
            n=0
            shot() { n=$((n+1)); import -window root /tmp/ci/client-$n.png; }
            if grep -q 'logged in with entity id\|joined the game' run/logs/latest.log 2>/dev/null; then
              sleep 45
              shot
              if [ -f .github/smoke-client-keys.txt ]; then
                while read -r kind arg; do
                  case "$kind" in
                    key) xdotool key "$arg";;
                    type) xdotool type --delay 40 "$arg";;
                    sleep) sleep "$arg";;
                    shot) shot;;
                    click) xdotool mousemove $arg click 1;;
                    rclick) xdotool mousemove $arg click 3;;
                  esac
                done < .github/smoke-client-keys.txt
              fi
            else
              shot
            fi
            pkill -f 'net.fabricmc' ; pkill -f KnotClient; sleep 5; pkill java
            tail -c 300000 client-gradle.log > /tmp/ci/client-gradle.log
            cp run/logs/latest.log /tmp/ci/client.log 2>/dev/null
            cp -r run/crash-reports /tmp/ci/client-crash-reports 2>/dev/null
          fi
      - name: Publish build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log || echo "no log" > /tmp/ci/build.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1 || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: createnuclear-fabric-26.2
          path: build/libs/*.jar
      - name: Publish the jar as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete fabric-26.2-latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$jar" createnuclear-fabric-26.2.jar
          gh release create fabric-26.2-latest createnuclear-fabric-26.2.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "Create Nuclear for Fabric 26.2 (pack build)" --notes "Built from the fabric-26.2 branch at ${GITHUB_SHA}. Needs Create Fly and Fabric API."
